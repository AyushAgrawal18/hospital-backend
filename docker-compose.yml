services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_NAME: ${MYSQL_DATABASE:-hospital}
      JWT_SECRET: ${JWT_SECRET:-supersecurehospitalkey}
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  db:
    image: mysql:8.4
    container_name: hospital-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
